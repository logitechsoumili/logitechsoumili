name: Update contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Prepare directories
        run: |
          mkdir -p assets
          mkdir -p data

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch

      - name: Copy generated files
        run: |
          mkdir -p output-branch/assets
          mkdir -p output-branch/data

          cp assets/contributions.svg \
             output-branch/assets/contributions.svg

          cp data/contributions.json \
             output-branch/data/contributions.json

      - name: Commit generated output
        working-directory: output-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg data/contributions.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update generated contributions"
            git push origin output
          fi
